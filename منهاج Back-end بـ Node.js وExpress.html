<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خارطة طريق Back-end بـ Node.js وExpress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#14213d;--mute:#5d6a80;--line:#dfe5ec;--pri:#3a4fd7;--pri-s:#e6e9fb;--wip:#c27a0a;--wip-s:#fdf0d8;--ok:#14845a;--ok-s:#dcf3e8;--shadow:0 1px 2px rgba(20,33,61,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--ink:#e8ecf6;--mute:#93a0ba;--line:#27324d;--pri:#8c9bff;--pri-s:#222c57;--wip:#f0b14d;--wip-s:#3a2d14;--ok:#4cd39b;--ok-s:#133a2c;--shadow:none}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f35;--ink:#e8ecf6;--mute:#93a0ba;--line:#27324d;--pri:#8c9bff;--pri-s:#222c57;--wip:#f0b14d;--wip-s:#3a2d14;--ok:#4cd39b;--ok-s:#133a2c;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
bdi,.ltr{unicode-bidi:isolate}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
.hero{padding:34px 0 22px}
.hero-g{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
h1{font-size:clamp(26px,5vw,40px);line-height:1.3;margin:0 0 10px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px;max-width:52ch}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(90deg) scaleX(-1)}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:34px;line-height:1}
.ring span{font-size:12px;color:var(--mute)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px;min-width:96px}
.stat b{display:block;font-size:22px;line-height:1.3}.stat span{font-size:13px;color:var(--mute)}
.next{display:inline-flex;gap:8px;align-items:center;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
:root[data-theme="dark"] .next{color:#0e1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{color:#0e1424}}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;align-items:center}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;cursor:pointer;color:var(--mute);font-weight:500;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--pri);font-weight:700}
.sp{flex:1}.ico{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--mute);font-size:13px;white-space:nowrap}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
main{padding:22px 0 60px}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.st{text-align:right;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow)}
.st[aria-pressed=true]{border-color:var(--pri);background:var(--pri-s)}
.st b{display:block;font-size:14px;line-height:1.4}.st small{color:var(--mute);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tools input,.tools select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tools input{flex:1;min-width:180px}
.sec{margin-bottom:30px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px;border-inline-start:4px solid var(--pri);padding-inline-start:12px}
.sech h2{margin:0;font-size:20px}.sech span{color:var(--mute);font-size:13px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.it summary{list-style:none;display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.it summary::-webkit-details-marker{display:none}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--pri-s);color:var(--pri);display:grid;place-content:center;font-size:13px;font-weight:700}
.it.s2 .num{background:var(--ok);color:#fff}.it.s1 .num{background:var(--wip-s);color:var(--wip)}
.it.s2 .tt{color:var(--mute)}
.tt{flex:1;min-width:0;font-weight:600}.tt small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--mute)}
.s1 .chip{background:var(--wip-s);color:var(--wip);border-color:transparent}.s2 .chip{background:var(--ok-s);color:var(--ok);border-color:transparent}
.body{padding:2px 16px 16px 16px;display:grid;gap:10px;border-top:1px dashed var(--line);margin:0 14px;padding-inline:0}
.body dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.body dt{color:var(--mute);font-size:13px}.body dd{margin:0}
textarea,.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start}
.pj h3{margin:0;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pj p{margin:0;font-size:14.5px}.pj p b{color:var(--mute);font-weight:500;font-size:13px;display:block}
.pj.s2{border-color:var(--ok)}
.tg{display:flex;flex-wrap:wrap;gap:6px}.tg span{background:var(--pri-s);color:var(--pri);border-radius:6px;padding:1px 9px;font-size:12.5px}
form.wk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:20px}
form.wk label{display:grid;gap:4px;font-size:13px;color:var(--mute)}form.wk .full{grid-column:1/-1}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
:root[data-theme="dark"] .btn{color:#0e1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0e1424}}
.wl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;gap:4px}
.wl h4{margin:0;display:flex;justify-content:space-between;gap:8px}.wl p{margin:0;font-size:14.5px}.wl p b{color:var(--mute);font-weight:500}
.empty{color:var(--mute);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:14px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.qa summary{padding:12px 16px;cursor:pointer;font-weight:600}.qa p{margin:0;padding:0 16px 14px;color:var(--mute)}
.hide{display:none!important}
@media (max-width:620px){.hero-g{grid-template-columns:1fr}.ring{order:-1}.chip{font-size:12px;padding:2px 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hero"><div class="wrap hero-g">
<div>
<h1>منهاجك لتعلّم Back-end بـ <bdi>Node.js</bdi> و<bdi>Express</bdi></h1>
<p class="sub">٨٨ موضوعًا في ٩ مراحل، و٧ مشاريع لملف أعمالك. تقدّمك يُحفظ تلقائيًا في هذا المتصفح.</p>
<div class="stats"><div class="stat"><b id="sTot">0</b><span>إجمالي العناصر</span></div><div class="stat"><b id="sWip">0</b><span>أعمل عليها</span></div><div class="stat"><b id="sDone">0</b><span>مكتملة</span></div></div>
<button class="next" id="next"></button>
</div>
<div class="ring" role="img" aria-label="نسبة الإنجاز"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="arc" cx="75" cy="75" r="64" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402" style="transition:stroke-dashoffset .5s"/></svg><div class="t"><b id="pct">0%</b><span>نسبة الإنجاز</span></div></div>
</div></header>
<nav class="tabs"><div class="wrap" role="tablist">
<button class="tab" role="tab" data-t="plan">الخطة الكاملة</button>
<button class="tab" role="tab" data-t="projects">المشاريع</button>
<button class="tab" role="tab" data-t="weekly">المراجعة الأسبوعية</button>
<button class="tab" role="tab" data-t="guide">دليل الاستخدام</button>
<span class="sp"></span><button class="ico" id="theme">الوضع</button><button class="ico" id="reset">تصفير</button>
</div></nav>
<main class="wrap">
<section id="plan">
<div class="stages" id="stages"></div>
<div class="tools"><input id="q" type="search" placeholder="ابحث في المواضيع…" aria-label="بحث"><select id="fs" aria-label="الحالة"><option value="">كل الحالات</option><option value="0">لم أبدأ</option><option value="1">أعمل عليه</option><option value="2">مكتمل</option></select></div>
<div id="list"></div>
</section>
<section id="projects" class="hide"><p class="sub">ابدأ بالمشاريع بالترتيب، ولا تنتقل للتالي قبل تحقيق معايير الإكمال.</p><div class="grid2" id="pj"></div></section>
<section id="weekly" class="hide">
<form class="wk" id="wf">
<label>الأسبوع / التاريخ<input class="in" name="w" required></label>
<label>هدف الأسبوع<input class="in" name="g"></label>
<label class="full">ما أنجزته<textarea name="a"></textarea></label>
<label>ما تعلّمته دون الرجوع للمصدر<textarea name="l"></textarea></label>
<label>ما تعثرت فيه<textarea name="s"></textarea></label>
<label>ماذا سأراجع؟<input class="in" name="r"></label>
<label>الخطوة التالية<input class="in" name="n"></label>
<label>ساعات التركيز<input class="in" name="h" type="number" min="0" step="0.5"></label>
<label>تقييم الأسبوع من ١٠<input class="in" name="e" type="number" min="0" max="10"></label>
<div class="full"><button class="btn" type="submit">أضف المراجعة</button></div>
</form>
<div id="wl"></div>
</section>
<section id="guide" class="hide" id="guide"><div id="qa"></div></section>
</main>
<script>
const D={"plan": [{"n": 1, "stage": "JavaScript وNode.js", "field": "JavaScript", "topic": "المتغيرات وأنواع البيانات", "learn": "let/const، strings، numbers، booleans، null، undefined", "practice": "اكتب برنامجًا يحسب بيانات بسيطة", "mastery": "تشرح الأنواع والتحويلات وتستخدمها دون ارتباك"}, {"n": 2, "stage": "JavaScript وNode.js", "field": "JavaScript", "topic": "الشروط والحلقات", "learn": "if/else، switch، for، while", "practice": "برنامج قائمة مهام نصي", "mastery": "تكتب شروطًا وحلقات لحالات متعددة"}, {"n": 3, "stage": "JavaScript وNode.js", "field": "JavaScript", "topic": "الدوال وScope", "learn": "parameters، return، scope، closures basics", "practice": "قسّم برنامجًا إلى دوال صغيرة", "mastery": "تكتب دوالًا قابلة لإعادة الاستخدام"}, {"n": 4, "stage": "JavaScript وNode.js", "field": "JavaScript", "topic": "Arrays وObjects", "learn": "الوصول والتعديل والتكرار", "practice": "إدارة مجموعة مستخدمين داخل الذاكرة", "mastery": "تتعامل مع البيانات المركبة بثقة"}, {"n": 5, "stage": "JavaScript وNode.js", "field": "JavaScript", "topic": "دوال المصفوفات", "learn": "map، filter، find، some، reduce", "practice": "فلترة وترتيب بيانات منتجات", "mastery": "تختار الدالة المناسبة وتشرح سببها"}, {"n": 6, "stage": "JavaScript وNode.js", "field": "JavaScript", "topic": "Destructuring وSpread وRest", "learn": "تفكيك الكائنات والمصفوفات ونسخ البيانات", "practice": "تحديث بيانات مستخدم دون تعديل غير مقصود", "mastery": "تستخدمها لقراءة الكود الحديث"}, {"n": 7, "stage": "JavaScript وNode.js", "field": "JavaScript", "topic": "Modules", "learn": "CommonJS require/module.exports وES Modules import/export", "practice": "قسّم التطبيق إلى ملفات", "mastery": "تستورد وتصدّر الدوال بطريقة صحيحة"}, {"n": 8, "stage": "JavaScript وNode.js", "field": "JavaScript", "topic": "الأخطاء والاستثناءات", "learn": "Error، throw، try/catch/finally", "practice": "تحقق من مدخلات برنامج صغير", "mastery": "تفرّق بين الخطأ المتوقع وغير المتوقع"}, {"n": 9, "stage": "JavaScript وNode.js", "field": "Async JavaScript", "topic": "Promise", "learn": "pending/fulfilled/rejected، then/catch", "practice": "استخدم Promise تجريبية", "mastery": "تشرح حالات Promise وكيفية التعامل معها"}, {"n": 10, "stage": "JavaScript وNode.js", "field": "Async JavaScript", "topic": "async/await", "learn": "انتظار Promise، ترتيب العمليات المعتمدة", "practice": "اجلب بيانات ثم عالجها", "mastery": "تحدد أين يلزم await وماذا يحدث بدونه"}, {"n": 11, "stage": "JavaScript وNode.js", "field": "Async JavaScript", "topic": "Event Loop basics", "learn": "call stack، callbacks، microtasks بصورة مفاهيمية", "practice": "توقع ترتيب طباعة مجموعة تعليمات", "mastery": "تشرح لماذا لا يتوقف Node.js كله عند await"}, {"n": 12, "stage": "JavaScript وNode.js", "field": "Node.js", "topic": "ما هو Node.js", "learn": "تشغيل JavaScript خارج المتصفح", "practice": "أنشئ ملفًا وشغله من الطرفية", "mastery": "تشرح الفرق بين JavaScript وNode.js"}, {"n": 13, "stage": "JavaScript وNode.js", "field": "Node.js", "topic": "npm وpackage.json", "learn": "dependencies، scripts، تثبيت الحزم", "practice": "أنشئ مشروعًا باستخدام npm init", "mastery": "تستطيع تثبيت حزمة وتشغيل script"}, {"n": 14, "stage": "JavaScript وNode.js", "field": "Node.js", "topic": "متغيرات البيئة", "learn": "process.env، ملف .env، عدم رفع الأسرار", "practice": "انقل PORT إلى متغير بيئة", "mastery": "لا تضع الأسرار مباشرة في الكود"}, {"n": 15, "stage": "JavaScript وNode.js", "field": "Node.js", "topic": "الملفات وPath", "learn": "fs، path، قراءة/كتابة ملف بشكل أساسي", "practice": "CLI يحفظ المهام في JSON", "mastery": "يقرأ البيانات ويحفظها ويتعامل مع أخطاء الملفات"}, {"n": 16, "stage": "HTTP والويب", "field": "مفاهيم الويب", "topic": "Client وServer وRequest/Response", "learn": "تدفق الطلب والاستجابة", "practice": "ارسم دورة طلب من المتصفح للسيرفر", "mastery": "تشرح دور كل طرف"}, {"n": 17, "stage": "HTTP والويب", "field": "HTTP", "topic": "Methods", "learn": "GET، POST، PUT، PATCH، DELETE", "practice": "صمم methods لمورد tasks", "mastery": "تختار method مناسبة لكل عملية"}, ختبارات والجودة", "focus": "الثقة بالكود"}, {"name": "النشر والتشغيل", "focus": "الإطلاق"}, {"name": "المواضيع المتقدمة", "focus": "التوسع والأداء"}, {"name": "مهارات مساندة", "focus": "Git وLinux والتوثيق"}], "projects": [{"n": 1, "name": "CLI لإدارة المهام", "req": "إضافة/عرض/تعديل/حذف المهام وحفظها بملف", "tech": "JavaScript، Node.js، fs، JSON", "done": "يعمل من الطرفية ويتعامل مع الملف المفقود والبيانات الخاطئة"}, {"n": 2, "name": "Tasks REST API", "req": "CRUD، حالات HTTP صحيحة، validation", "tech": "Express، REST، Middleware", "done": "Routes منظمة، أخطاء موحدة، اختبارها بأداة API"}, {"n": 3, "name": "API متصل بقاعدة بيانات", "req": "حفظ دائم، بحث، pagination، filters", "tech": "MongoDB/Mongoose أو PostgreSQL", "done": "البيانات تبقى بعد إعادة تشغيل السيرفر، وعمليات CRUD تعمل"}, {"n": 4, "name": "نظام مستخدمين وصلاحيات", "req": "Register/Login، حماية المسارات، ملكية الموارد", "tech": "Hashing، Sessions أو JWT، Authorization", "done": "لا يستطيع مستخدم الوصول إلى بيانات غيره، وكلمات المرور محمية"}, {"n": 5, "name": "API مختبَر وموثّق", "req": "Unit/Integration tests، OpenAPI docs", "tech": "Vitest/Jest، Supertest، Swagger/OpenAPI", "done": "اختبارات النجاح والفشل تعمل، وREADME يشرح التشغيل"}, {"n": 6, "name": "مشروع منشور Production", "req": "نشر API وقاعدة البيانات، env، logging، health check", "tech": "Git، Deployment، HTTPS، Docker basics", "done": "رابط عام يعمل، لا توجد أسرار في Git، وإعدادات الإنتاج موثقة"}, {"n": 7, "name": "مشروع متقدم اختياري", "req": "Caching أو background jobs أو WebSockets حسب الحاجة", "tech": "Redis أو Queue أو WebSocket", "done": "تشرح المشكلة التي يحلها الاختيار وتقيس أثره"}], "faq": [{"q": "كيف أبدأ؟", "a": "ابدأ بالمرحلة 1 في «الخطة الكاملة». لا يلزم إكمال كل موضوع نظريًا؛ تعلّم الأساس ثم طبّقه."}, {"q": "كيف أضع علامة؟", "a": "في عمود «الحالة» اختر «مكتمل» من القائمة المنسدلة، أو اختر ✓ في عمود «تم؟». يفضّل تحديث الاثنين معًا."}, {"q": "متى أعتبر الموضوع مكتملًا؟", "a": "عندما تستطيع شرحه بكلماتك، وكتابة مثال صغير دون نسخ، واستخدامه في مشروع، والتعامل مع حالة خطأ واحدة على الأقل."}, {"q": "كم أدرس يوميًا؟", "a": "ابدأ بوقت مستدام يناسبك، مثل 45–90 دقيقة في اليوم إن كان ذلك مناسبًا لجدولك. لا تعتبر هذا شرطًا؛ الاستمرارية أهم."}, {"q": "كيف أتعامل مع التعثر؟", "a": "اكتب السؤال أو الخطأ في الملاحظات، اقرأ رسالة الخطأ، جرّب حلًا، ثم راجع المصدر. إذا بقيت عالقًا، اطلب شرحًا للمفهوم المحدد."}, {"q": "هل أتعلم MongoDB أم PostgreSQL؟", "a": "اختر واحدة للمشروع الأول. MongoDB/Mongoose مناسب لمسار الوثائق، وPostgreSQL خيار قوي للبيانات العلائقية. تعلم SQL لاحقًا مفيد في الحالتين."}, {"q": "هل أحتاج TypeScript؟", "a": "ليس شرطًا لأول API، لكنه مهارة قوية بعد أساسيات JavaScript وExpress. أضفه بعد إكمال مشروع CRUD، أو قبله إذا كانت الوظائف المستهدفة تشترطه."}, {"q": "هل أحتاج Microservices؟", "a": "لا في البداية. ابنِ تطبيقًا منظمًا واحدًا (monolith) أولًا، ثم تعلم توزيع الخدمات عندما توجد حاجة واضحة."}, {"q": "كيف أعرف أنني جاهز لمشروع مستقل؟", "a": "إذا استطعت تصميم API، ربط DB، تطبيق validation وauth، كتابة اختبارات أساسية، توثيق المشروع ونشره، فأنت جاهز لمشروع أكبر مع استمرار التعلم."}, {"q": "ملاحظة تقنية", "a": "بعض السلوكيات تختلف حسب إصدار Express والمكتبات المستخدمة. راجع الوثائق الرسمية عند تطبيق تفاصيل معالجة الأخطاء والأمان."}]};
const KEY="be-roadmap-v1",SN=["لم أبدأ","أعمل عليه","مكتمل"];
let S={st:{},nt:{},ps:{},pl:{},wk:[]},stage="",open=new Set();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const g=n=>S.st[n]||0;
function stats(){const t=D.plan.length,d=D.plan.filter(p=>g(p.n)==2).length,w=D.plan.filter(p=>g(p.n)==1).length,p=t?d/t:0;
$("#sTot").textContent=t;$("#sDone").textContent=d;$("#sWip").textContent=w;$("#pct").textContent=Math.round(p*100)+"%";$("#arc").style.strokeDashoffset=402*(1-p);
const nx=D.plan.find(x=>g(x.n)==1)||D.plan.find(x=>g(x.n)==0);const b=$("#next");
if(nx){b.hidden=false;b.textContent=(g(nx.n)==1?"أكمل: ":"ابدأ بـ ")+nx.topic;b.onclick=()=>{stage="";$("#q").value="";$("#fs").value="";open.add(nx.n);tab("plan");draw();setTimeout(()=>{const e=$('[data-n="'+nx.n+'"]');e&&e.scrollIntoView({block:"center"})},50)}}else{b.textContent="أنجزت المنهاج كاملًا 🎉";b.onclick=null}
$$(".st").forEach(e=>{const n=e.dataset.s,a=D.plan.filter(p=>p.stage==n),c=a.filter(p=>g(p.n)==2).length;e.querySelector("small").textContent=c+" / "+a.length;e.querySelector("i").style.width=(a.length?c/a.length*100:0)+"%"})}
function drawStages(){$("#stages").innerHTML=D.stages.map(s=>`<button class="st" data-s="${esc(s.name)}" aria-pressed="${stage==s.name}"><b>${esc(s.name)}</b><small></small><div class="bar"><i></i></div></button>`).join("");
$$(".st").forEach(e=>e.onclick=()=>{stage=stage==e.dataset.s?"":e.dataset.s;drawStages();draw();stats()})}
function draw(){const q=$("#q").value.trim().toLowerCase(),f=$("#fs").value;let h="";
D.stages.forEach(s=>{if(stage&&stage!=s.name)return;const all=D.plan.filter(p=>p.stage==s.name);
const it=all.filter(p=>(!f||g(p.n)==f)&&(!q||[p.topic,p.field,p.learn,p.practice,p.mastery].join(" ").toLowerCase().includes(q)));if(!it.length)return;
const dn=all.filter(p=>g(p.n)==2).length;
h+=`<div class="sec"><div class="sech"><h2>${esc(s.name)}</h2><span>${esc(s.focus)} · ${dn}/${all.length}</span></div>`+it.map(p=>{const v=g(p.n);
return `<details class="it s${v}" data-n="${p.n}" ${open.has(p.n)?"open":""}><summary><span class="num">${v==2?"✓":p.n}</span><span class="tt">${esc(p.topic)}<small>${esc(p.field)}</small></span><button class="chip" data-c="${p.n}" title="غيّر الحالة">${SN[v]}</button></summary><div class="body"><dl><dt>ماذا تتعلم؟</dt><dd>${esc(p.learn)}</dd><dt>التطبيق العملي</dt><dd>${esc(p.practice)}</dd><dt>معيار الإتقان</dt><dd>${esc(p.mastery)}</dd></dl><textarea data-nt="${p.n}" placeholder="ملاحظاتك أو رابط الدرس…" aria-label="ملاحظات">${esc(S.nt[p.n]||"")}</textarea></div></details>`}).join("")+"</div>"});
$("#list").innerHTML=h||'<div class="empty">لا توجد عناصر مطابقة. غيّر البحث أو الفلتر.</div>';
$$("#list details").forEach(d=>d.ontoggle=()=>{const n=+d.dataset.n;d.open?open.add(n):open.delete(n)});
$$("[data-c]").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const n=+b.dataset.c;S.st[n]=(g(n)+1)%3;save();draw();stats()});
$$("[data-nt]").forEach(t=>t.oninput=()=>{S.nt[t.dataset.nt]=t.value;save()})}
function drawProj(){$("#pj").innerHTML=D.projects.map(p=>{const v=S.ps[p.n]||0;return `<article class="pj s${v}"><h3><span>${p.n}. ${esc(p.name)}</span><button class="chip" data-p="${p.n}" style="${v==2?"background:var(--ok-s);color:var(--ok)":v==1?"background:var(--wip-s);color:var(--wip)":""}">${SN[v]}</button></h3><p><b>المتطلبات</b>${esc(p.req)}</p><div class="tg">${p.tech.split(/[،,]/).map(t=>`<span>${esc(t.trim())}</span>`).join("")}</div><p><b>معايير الإكمال</b>${esc(p.done)}</p><input class="in ltr" dir="ltr" data-pl="${p.n}" placeholder="GitHub / Demo link" value="${esc(S.pl[p.n]||"")}" aria-label="رابط"></article>`}).join("");
$$("[data-p]").forEach(b=>b.onclick=()=>{const n=b.dataset.p;S.ps[n]=((S.ps[n]||0)+1)%3;save();drawProj()});
$$("[data-pl]").forEach(i=>i.oninput=()=>{S.pl[i.dataset.pl]=i.value;save()})}
function drawWk(){$("#wl").innerHTML=S.wk.length?S.wk.map((w,i)=>`<div class="wl"><h4><span>${esc(w.w)}${w.g?" — "+esc(w.g):""}</span><button class="ico" data-d="${i}">حذف</button></h4>${[["ما أنجزته","a"],["تعلّمته","l"],["تعثرت فيه","s"],["سأراجع","r"],["الخطوة التالية","n"]].map(([k,f])=>w[f]?`<p><b>${k}: </b>${esc(w[f])}</p>`:"").join("")}<p><b>ساعات التركيز: </b>${esc(w.h||"–")} · <b>التقييم: </b>${esc(w.e||"–")}/10</p></div>`).join(""):'<div class="empty">لا توجد مراجعات بعد. أضف أول مراجعة من النموذج أعلاه.</div>';
$$("[data-d]").forEach(b=>b.onclick=()=>{S.wk.splice(+b.dataset.d,1);save();drawWk()})}
$("#wf").onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));S.wk.unshift(o);save();e.target.reset();drawWk()};
$("#qa").innerHTML=D.faq.map(f=>`<details class="qa"><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");
function tab(t){$$("section").forEach(s=>s.classList.toggle("hide",s.id!=t));$$(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t==t));if(location.hash!="#"+t)history.replaceState(null,"","#"+t)}
$$(".tab").forEach(b=>b.onclick=()=>tab(b.dataset.t));
$("#q").oninput=draw;$("#fs").onchange=draw;
$("#reset").onclick=()=>{if(confirm("سيتم مسح كل تقدمك وملاحظاتك. هل تريد المتابعة؟")){S={st:{},nt:{},ps:{},pl:{},wk:[]};open.clear();save();drawStages();draw();drawProj();drawWk();stats()}};
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
drawStages();draw();drawProj();drawWk();stats();
const h=(location.hash||"").slice(1);tab(["plan","projects","weekly","guide"].includes(h)?h:"plan");
</script>
</body>
</html>
